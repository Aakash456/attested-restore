[package]
name = "attested-restore"
version = "0.1.0"
edition = "2021"
description = "Research prototype: attested, rollback-resistant snapshot/restore for confidential VMs"
license = "MIT"

[lib]
name = "attested_restore"
path = "src/lib.rs"

[[bin]]
name = "attested-restore"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
